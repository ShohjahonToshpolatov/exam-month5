<div class="container">

  <div class="page-header animate-in">
    <h1>🏷️ Kategoriyalar</h1>
    <a class="back-link" routerLink="/admin">← Dashboard</a>
  </div>

  <div class="card animate-in animate-in-delay-1" style="margin-bottom:28px;">
    <h2 style="margin-bottom:16px;">➕ Yangi kategoriya</h2>
    <form ngNativeValidate class="row" style="gap:12px;" (ngSubmit)="create()">
      <input
        id="new-category-input"
        name="name" maxlength="50"
        [(ngModel)]="name"
        placeholder="Kategoriya nomi"
        style="flex:1; min-width:200px;"
        required
      />
      <button id="add-category-btn" class="btn pill" type="submit">
        + Qo'shish
      </button>
    </form>
    <p class="error">{{error}}</p>
  </div>

  <div class="card table-wrap animate-in animate-in-delay-2">
    <h2 style="margin-bottom:20px;">📋 Barcha kategoriyalar</h2>

    <div class="empty-state" *ngIf="categories.length === 0">
      <div class="empty-icon">🏷️</div>
      <p>Hali kategoriyalar yo'q</p>
    </div>

    <table class="table" *ngIf="categories.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nomi</th>
          <th style="text-align:right;">Amal</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of categories" id="category-row-{{c.id}}">
          <td>
            <span style="background:var(--glass-2); border:1px solid var(--glass-border); border-radius:6px; padding:3px 10px; font-size:0.8rem; font-family:monospace;">
              #{{c.id}}
            </span>
          </td>
          <td style="font-weight:500; color:var(--text-primary);">
            <span *ngIf="editingId !== c.id">{{c.name}}</span>
            <input *ngIf="editingId === c.id" [(ngModel)]="editName" maxlength="50" aria-label="Kategoriya nomi" />
          </td>
          <td style="text-align:right;">
            <button *ngIf="editingId !== c.id" class="btn secondary" (click)="edit(c)">Tahrirlash</button>
            <button *ngIf="editingId === c.id" class="btn" (click)="save()">Saqlash</button>
            <button *ngIf="editingId === c.id" class="btn secondary" (click)="editingId = 0">Bekor qilish</button>
            <button
              class="btn danger"
              style="padding:7px 14px; font-size:0.82rem;"
              id="delete-cat-{{c.id}}"
              (click)="remove(c.id)"
            >
              🗑️ O'chirish
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
