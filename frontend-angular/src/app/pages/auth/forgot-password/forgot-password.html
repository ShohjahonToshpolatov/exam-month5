<div class="auth-page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="box">
    <div class="text-center mb-24">
      <div style="font-size:2.5rem; margin-bottom:8px; filter: drop-shadow(0 0 20px rgba(255,165,2,0.6));">🔑</div>
      <h1>Parolni tiklash</h1>
      <p class="subtitle">Emailingizga tiklash kodi yuboramiz</p>
    </div>

    <form ngNativeValidate class="form" (ngSubmit)="submit()">
      <label>
        Email manzil
        <input
          id="forgot-email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="email@misol.uz"
          required
        />
      </label>

      <p class="error">{{error}}</p>
      <p class="success">{{message}}</p>

      <button id="forgot-btn" class="btn w-full mt-8" type="submit">
        📨 Kod yuborish
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/reset-password" [queryParams]="{email: email}">🔒 Yangi parol o'rnatish</a>
      <a routerLink="/login">⚡ Kirish</a>
    </div>
  </div>
</div>
