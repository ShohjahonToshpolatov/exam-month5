<div class="auth-page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="box">
    <div class="text-center mb-24">
      <div style="font-size:2.5rem; margin-bottom:8px; filter: drop-shadow(0 0 20px rgba(255,107,157,0.6));">🔒</div>
      <h1>Yangi parol</h1>
      <p class="subtitle">Yangi kuchli parol o'rnating</p>
    </div>

    <form ngNativeValidate class="form" (ngSubmit)="submit()">
      <label>
        Email manzil
        <input
          id="reset-email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="email@misol.uz"
          required
        />
      </label>

      <label>
        Tasdiqlash kodi
        <input
          id="reset-code"
          name="code" minlength="6" maxlength="6"
          [(ngModel)]="code"
          placeholder="Emaildan kelgan kod"
          required
        />
      </label>

      <label>
        Yangi parol
        <input
          id="reset-new-password"
          name="newPassword" minlength="8" maxlength="72"
          type="password"
          [(ngModel)]="newPassword"
          placeholder="Yangi kuchli parol"
          required
        />
      </label>

      <p class="error">{{error}}</p>

      <button id="reset-btn" class="btn w-full mt-8" type="submit">
        💾 Parolni saqlash
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">⚡ Kirish sahifasi</a>
    </div>
  </div>
</div>
