<div class="auth-page">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="box">
    <div class="text-center mb-24">
      <div style="font-size:2.5rem; margin-bottom:8px; filter: drop-shadow(0 0 20px rgba(0,229,160,0.6));">📧</div>
      <h1>Email tasdiqlash</h1>
      <p class="subtitle">Emailingizga yuborilgan kodni kiriting</p>
    </div>

    <form ngNativeValidate class="form" (ngSubmit)="submit()">
      <label>
        Email manzil
        <input
          id="verify-email"
          name="email"
          [(ngModel)]="email"
          placeholder="email@misol.uz"
          required
        />
      </label>

      <label>
        Tasdiqlash kodi (6 xona)
        <input
          id="verify-code"
          name="code" minlength="6" maxlength="6"
          [(ngModel)]="code"
          maxlength="6"
          placeholder="______"
          required
          style="letter-spacing: 8px; font-size: 1.2rem; font-weight: 700; text-align: center;"
        />
      </label>

      <p class="error">{{error}}</p>
      <p class="success">{{message}}</p>

      <button id="verify-btn" class="btn w-full" type="submit">
        ✅ Tasdiqlash
      </button>

      <button
        id="resend-btn"
        class="btn secondary w-full"
        type="button"
        (click)="resend()"
      >
        🔄 Kodni qayta yuborish
      </button>
    </form>
  </div>
</div>
