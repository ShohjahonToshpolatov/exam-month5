<div class="container">
  <!-- Navbar -->
  <nav class="navbar" style="position: static; margin: -32px -24px 32px; padding: 0 24px; border-radius: 0 0 20px 20px;">
    <a class="navbar-brand" routerLink="/items">🔍 TopFind</a>
    <div class="navbar-links">
      <a class="nav-link" routerLink="/items">E'lonlar</a>
      <a class="nav-link" routerLink="/profile">Profil</a>
    </div>
  </nav>

  <div class="page-header animate-in">
    <h1>🤝 Da'volarim</h1>
    <a class="back-link" routerLink="/items">← E'lonlar</a>
  </div>

  <p class="error" *ngIf="error">{{error}}</p>

  <!-- Empty state -->
  <div class="empty-state animate-in" *ngIf="claims.length === 0">
    <div class="empty-icon">📭</div>
    <p>Hali da'volar yo'q</p>
    <p class="muted mt-8">E'lonlarga da'vo yuboring</p>
    <a class="btn pill" style="margin-top:20px;" routerLink="/items">
      🔍 E'lonlarga o'tish
    </a>
  </div>

  <!-- Claims grid -->
  <div class="grid grid-2 animate-in animate-in-delay-1">
    <div class="claim-card" *ngFor="let c of claims" id="my-claim-{{c.id}}">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <strong style="font-size:1rem;">
          📦 {{c.item_title || c.title || "E'lon"}}
        </strong>
        <span
          class="badge"
          [class.badge-active]="c.status === 'pending' || c.status === 'approved'"
          [class.badge-closed]="c.status === 'rejected'"
          style="font-size:0.7rem;"
        >
          <span *ngIf="c.status === 'pending'">⏳ Kutilmoqda</span>
          <span *ngIf="c.status === 'approved'">✅ Tasdiqlandi</span>
          <span *ngIf="c.status === 'rejected'">❌ Rad etildi</span>
          <span *ngIf="c.status !== 'pending' && c.status !== 'approved' && c.status !== 'rejected'">{{c.status}}</span>
        </span>
      </div>
      <p>{{c.message || 'Xabar mavjud emas'}}</p>
      <p class="muted" *ngIf="c.answer" style="margin-top:8px;">
        <strong>Javobingiz:</strong> {{c.answer}}
      </p>
    </div>
  </div>
</div>
