<div class="container">

  <div class="page-header animate-in">
    <h1>🤝 Da'volarim</h1>
    <a class="back-link" routerLink="/items">← E'lonlar</a>
  </div>

  <p class="error" *ngIf="error">{{error}}</p>

  <div class="empty-state animate-in" *ngIf="!loading && !error && claims.length === 0">
    <div class="empty-icon">📭</div>
    <p>Hali da'volar yo'q</p>
    <p class="muted mt-8">E'lonlarga da'vo yuboring</p>
    <a class="btn pill" style="margin-top:20px;" routerLink="/items">
      🔍 E'lonlarga o'tish
    </a>
  </div>

  <p *ngIf="loading" class="muted">Yuklanmoqda...</p>
  <div class="grid grid-2 animate-in animate-in-delay-1">
    <div class="claim-card" *ngFor="let c of claims" id="my-claim-{{c.id}}">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <strong style="font-size:1rem;">
          📦 {{c.item_title || c.title || "E'lon"}}
        </strong>
        <span
          class="badge"
          [class.badge-active]="c.status === 'pending' || c.status === 'accepted'"
          [class.badge-closed]="c.status === 'rejected'"
          style="font-size:0.7rem;"
        >
          <span *ngIf="c.status === 'pending'">⏳ Kutilmoqda</span>
          <span *ngIf="c.status === 'accepted'">✅ Tasdiqlandi</span>
          <span *ngIf="c.status === 'rejected'">❌ Rad etildi</span>
          <span *ngIf="c.status !== 'pending' && c.status !== 'accepted' && c.status !== 'rejected'">{{c.status}}</span>
        </span>
      </div>
      <a class="back-link" [routerLink]="['/items', c.item_id]">E’lonni ko‘rish →</a>
      <p>{{c.message || 'Xabar mavjud emas'}}</p>
      <p class="muted" *ngIf="c.answer" style="margin-top:8px;">
        <strong>Javobingiz:</strong> {{c.answer}}
      </p>
    </div>
  </div>
</div>
