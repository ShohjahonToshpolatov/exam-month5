<div class="container">

  <a class="back-link" routerLink="/items">← E'lonlarga qaytish</a>

  <div class="card animate-in" style="max-width: 700px; margin: 0 auto;">
    <div style="text-align:center; margin-bottom:32px;">
      <div style="font-size:3rem; margin-bottom:12px; filter:drop-shadow(0 0 20px rgba(255,165,2,0.5));">✏️</div>
      <h1>E'lonni tahrirlash</h1>
      <p class="muted">Quyidagi ma'lumotlarni yangilang</p>
    </div>

    <form ngNativeValidate class="form" (ngSubmit)="submit()">
      <label>
        Sarlavha
        <input
          id="edit-title"
          name="title" minlength="5" maxlength="100"
          [(ngModel)]="title"
          placeholder="Buyum sarlavhasi"
          required
        />
      </label>

      <label>
        Tavsif
        <textarea
          id="edit-description"
          required name="description" minlength="10" maxlength="1000"
          [(ngModel)]="description"
          placeholder="Batafsil tavsif..."
          style="min-height:120px;"
        ></textarea>
      </label>

      <label>
        Joylashuv
        <input
          id="edit-location"
          name="location" minlength="3" maxlength="150"
          [(ngModel)]="location"
          placeholder="📍 Manzil"
        />
      </label>

      <label>
        Kategoriya
        <select id="edit-category" name="category_id" [(ngModel)]="category_id">
          <option value="">🏷️ Kategoriya</option>
          <option *ngFor="let c of categories" [value]="c.id">{{c.name}}</option>
        </select>
      </label>

      <p class="error">{{error}}</p>

      <button [disabled]="loading || status !== 'active'" id="edit-save-btn" class="btn w-full" type="submit" style="padding:14px;">
        💾 Saqlash
      </button>
    </form>
  </div>
</div>
