<div class="container"><div class="card"><h1>E'lonni tahrirlash</h1><form class="form" (ngSubmit)="submit()"><label>Sarlavha<input name="title" [(ngModel)]="title" required></label><label>Tavsif<textarea name="description" [(ngModel)]="description"></textarea></label><label>Joylashuv<input name="location" [(ngModel)]="location"></label><label>Kategoriya<select name="category_id" [(ngModel)]="category_id"><option *ngFor="let c of categories" [value]="c.id">{{c.name}}</option></select></label><label>Status<select name="status" [(ngModel)]="status"><option value="active">active</option><option value="closed">closed</option></select></label><button class="btn">Saqlash</button></form><p class="error">{{error}}</p></div></div>
