<div class="container"><div class="row"><h1>Topildi</h1><a class="btn" routerLink="/items/create">+ E'lon berish</a><a routerLink="/claims">Da'volarim</a><a routerLink="/profile">Profil</a></div><div class="card form"><div class="grid grid-3"><input [(ngModel)]="search" placeholder="Qidirish"><select [(ngModel)]="type"><option value="">Barchasi</option><option value="lost">Yo'qolgan</option><option value="found">Topilgan</option></select><select [(ngModel)]="category_id"><option value="">Kategoriya</option><option *ngFor="let c of categories" [value]="c.id">{{c.name}}</option></select></div><div class="row"><button class="btn" (click)="load()">Qidirish</button><button class="btn secondary" (click)="reset()">Tozalash</button></div></div><p class="error">{{error}}</p><p *ngIf="loading">Yuklanmoqda...</p><div class="grid grid-3"><article class="card" *ngFor="let item of items"><h3>{{item.title}}</h3><p>{{item.description}}</p><p class="muted">{{item.location}} · {{item.type}}</p><a class="btn" [routerLink]="['/items',item.id]">Ko'rish</a></article></div><div class="row"><button class="btn secondary" (click)="prev()" [disabled]="page===1">‹ Oldingi</button><span>{{page}}</span><button class="btn secondary" (click)="next()" [disabled]="items.length<limit">Keyingi ›</button></div></div>
